<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务服务管理</title>
    <!-- 引入 Fluent UI 样式 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fabric.min.css') }}">
    <!-- 引入自定义样式 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/manager.css') }}">
</head>
<body class="ms-Fabric">
    <header class="ms-bgColor-themePrimary ms-fontColor-white ms-font-xl ms-textAlign-center ms-fontWeight-semibold ms-Grid page-header">
        <h4>任务服务管理</h4>
        <div class="user-info" id="userInfo"></div>
        <div class="logout-container">
            <button class="logout-btn" id="logoutBtn">退出登录</button>
        </div>
    </header>
    <main class="ms-Grid main-container">
        <div class="table-wrapper">
        <table class="ms-Table" id="task-list">
            <thead>
                <tr>
                    <th class="ms-Table-cell task-id-col">任务ID</th>
                    <th class="ms-Table-cell">任务名称</th>
                    <th class="ms-Table-cell">UDP端口</th>
                    <th class="ms-Table-cell">创建时间</th>
                    <th class="ms-Table-cell">视频端口</th>                                        
                    <th class="ms-Table-cell">摄像机1_ip</th>
                    <th class="ms-Table-cell">摄像机1_用户名</th>
                    <th class="ms-Table-cell">摄像机1_密码</th>
                    <th class="ms-Table-cell">视频URL</th>
                    <th class="ms-Table-cell">事件端口</th>
                    <th class="ms-Table-cell">操作</th>
                    <!-- <th class="ms-Table-cell">摄像机2_ip</th>
                    <th class="ms-Table-cell">摄像机2_用户名</th>
                    <th class="ms-Table-cell">摄像机2_密码</th>
                    <th class="ms-Table-cell">摄像机2_类型</th> -->
                    
                </tr>
            </thead>
            <tbody id="task-list-body">
                <tr id="loading-row">
                    <td class="ms-Table-cell table-message-cell" colspan="12">加载中...</td>
                </tr>
               
         </tbody>
        </table>
        </div>
    </main>

    <div class="toast-container" aria-live="polite" aria-atomic="true">
        <div class="toast-message success" id="taskToast">
            <div class="toast-content">
                <span class="toast-icon" id="taskToastIcon">✔</span>
                <div class="toast-text">
                    <p class="toast-title" id="taskToastTitle">操作成功</p>
                    <p class="toast-body" id="taskToastBody">任务信息已更新。</p>
                </div>
                <button type="button" class="toast-close" id="taskToastClose" aria-label="关闭提示">×</button>
            </div>
        </div>
    </div>

    <div class="confirm-mask" id="taskConfirmModal" aria-hidden="true">
        <div class="confirm-panel" role="dialog" aria-modal="true" aria-labelledby="taskConfirmTitle" aria-describedby="taskConfirmBody">
            <h3 class="confirm-title" id="taskConfirmTitle">请确认操作</h3>
            <p class="confirm-body" id="taskConfirmBody">确认要继续执行当前操作吗？</p>
            <div class="confirm-actions">
                <button type="button" class="modal-action-btn cancel" id="taskConfirmCancelBtn">取消</button>
                <button type="button" class="modal-action-btn submit" id="taskConfirmSubmitBtn">确定</button>
            </div>
        </div>
    </div>

    <div class="modal-mask" id="editTaskModal" aria-hidden="true">
        <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="editTaskTitle">
            <h3 class="modal-title" id="editTaskTitle">修改任务</h3>
            <form id="editTaskForm">
                <input type="hidden" id="editTaskId" name="taskId">
                <div class="modal-form-grid">
                    <div class="modal-form-item">
                        <label for="editTaskName">任务名称</label>
                        <input type="text" id="editTaskName" name="taskname" maxlength="100">
                    </div>
                    <div class="modal-form-item">
                        <label for="editUdpPort">UDP端口</label>
                        <input type="number" id="editUdpPort" name="udp_port" min="1">
                    </div>
                    <div class="modal-form-item">
                        <label for="editVideoPort">视频端口</label>
                        <input type="number" id="editVideoPort" name="port" min="1">
                    </div>
                    <div class="modal-form-item">
                        <label for="editEventPort">事件端口</label>
                        <input type="number" id="editEventPort" name="event_port" min="1">
                    </div>
                    <div class="modal-form-item">
                        <label for="editTestMode">测试模式</label>
                        <select id="editTestMode" name="test_mode">
                            <option value="0">否</option>
                            <option value="1">是</option>
                        </select>
                    </div>
                    <div class="modal-form-item">
                        <label for="editCam1Ip">摄像机1_ip</label>
                        <input type="text" id="editCam1Ip" name="cam1_ip" maxlength="1000">
                    </div>
                    <div class="modal-form-item">
                        <label for="editCam1Username">摄像机1_用户名</label>
                        <input type="text" id="editCam1Username" name="cam1_username" maxlength="1000">
                    </div>
                    <div class="modal-form-item">
                        <label for="editCam1Password">摄像机1_密码</label>
                        <input type="text" id="editCam1Password" name="cam1_password" maxlength="1000">
                    </div>
                    <div class="modal-form-item full-width">
                        <label for="editUrl">视频URL</label>
                        <input type="text" id="editUrl" name="url" maxlength="4000">
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="modal-action-btn cancel" id="cancelEditTaskBtn">取消</button>
                    <button type="submit" class="modal-action-btn submit" id="saveEditTaskBtn">保存</button>
                </div>
            </form>
        </div>
    </div>

     <!-- 引入 jQuery -->
     <script src="{{ url_for('static', filename='js/jquery-3.6.0.min.js') }}"></script>
     <script src="{{ url_for('static', filename='js/manager.js') }}"></script>
</body>
</html>
